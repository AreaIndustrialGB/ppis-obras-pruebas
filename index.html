 acumulativos y incompatibilidades entre edificio, urbanizacion e instalaciones.","nivel":"A","momento_tipo":"Previo / Punto de parada","aplicabilidad":"Todas las obras.","base_referencia":"Propuesta interna transversal. El presupuesto no incorpora los planos de replanteo/topografía."},{"codigo":"00.02","nombre":"Ejes, retícula y límites","capitulo_codigo":"00","tipo_control":"primera_unidad","frecuencia":"100% de ejes principales; nueva comprobación al comenzar cada fase estructural.","criterio":"Comprobar ejes principales, retícula de pilares, alineaciones de fachada y muelles, límites de parcela y distancias a elementos existentes.","referencia_doc":"Propuesta interna transversal. El presupuesto no incorpora los planos de replanteo/topografía.","orden":2,"riesgo":"Pilares, cerramientos o muelles fuera de posición; invasiones de linderos; necesidad de adaptar piezas ya fabricadas.","nivel":"A","momento_tipo":"Previo / Primera unidad","aplicabilidad":"Todas las obras.","base_referencia":"Propuesta interna transversal. El presupuesto no incorpora los planos de replanteo/topografía."},{"codigo":"00.03","nombre":"Compatibilidad de cotas funcionales","capitulo_codigo":"00","tipo_control":"punto_parada","frecuencia":"Antes de cimentaciones, fosos de muelle, soleras y pavimentos; repetir tras cambios de proyecto.","criterio":"Cruzar cotas de estructura, solera, viales, muelles, redes y equipos antes de ejecutar elementos irreversibles.","referencia_doc":"Propuesta interna transversal. El presupuesto no incorpora los planos de replanteo/topografía.","orden":3,"riesgo":"Escalones, pendientes imposibles, muelles inutilizables, arquetas fuera de rasante y conflictos entre disciplinas.","nivel":"A","momento_tipo":"Punto de parada","aplicabilidad":"Todas las obras.","base_referencia":"Propuesta interna transversal. El presupuesto no incorpora los planos de replanteo/topografía."},{"codigo":"01.01","nombre":"Zonificacion de excavaciones y rellenos","capitulo_codigo":"01","tipo_control":"primera_unidad","frecuencia":"Por sector y cada cambio de estrato, procedencia o solución de relleno.","criterio":"Validar la zonificacion de desmontes, terraplenes, suelos no aptos, materiales de prestamo y cotas de excavación/relleno antes de la producción masiva.","referencia_doc":"Presupuesto Dos Hermanas: caps. 01.01 y 02.01, pags. 2 y 75.","orden":1,"riesgo":"Uso de material inadecuado, sobreexcavaciones, asientos diferenciales y sobrecostes de sustitucion.","nivel":"A","momento_tipo":"Previo / Primera unidad","aplicabilidad":"Todas las obras con movimiento de tierras relevante.","base_referencia":"Presupuesto Dos Hermanas: caps. 01.01 y 02.01, pags. 2 y 75."},{"codigo":"01.02","nombre":"Ejecución de tongadas y niveles","capitulo_codigo":"01","tipo_control":"periodico","frecuencia":"Cada tongada y aproximadamente cada 2.000 m2/lote, ajustable al plan de obra.","criterio":"Comprobar espesor real de tongadas, extendido, humectacion, compactacion operativa y cotas. No sustituye a los ensayos del laboratorio.","referencia_doc":"Presupuesto Dos Hermanas: caps. 01.01 y 02.01, pags. 2 y 75.","orden":2,"riesgo":"Capas demasiado gruesas, compactacion no homogenea, perdida de capacidad portante y cotas incompatibles con las capas posteriores.","nivel":"A","momento_tipo":"Periódico","aplicabilidad":"Puede simplificarse en actuaciones con excavación mínima y sin rellenos estructurales.","base_referencia":"Presupuesto Dos Hermanas: caps. 01.01 y 02.01, pags. 2 y 75."},{"codigo":"01.03","nombre":"Transiciones y zonas reparadas","capitulo_codigo":"01","tipo_control":"punto_parada","frecuencia":"100% de transiciones, zanjas reparadas y zonas singulares antes de cubrir.","criterio":"Controlar bordes de terraplen, encuentros desmonte-relleno, trasdosados, rellenos de zanjas y reparaciones posteriores de la explanada.","referencia_doc":"Presupuesto Dos Hermanas: caps. 01.01 y 02.01, pags. 2 y 75.","orden":3,"riesgo":"Asientos localizados bajo soleras o viales y fisuras en zonas de distinta rigidez.","nivel":"B","momento_tipo":"Punto de parada / Periódico","aplicabilidad":"Susceptible de reducirse si no hay rellenos ni redes que alteren la explanada.","base_referencia":"Presupuesto Dos Hermanas: caps. 01.01 y 02.01, pags. 2 y 75."},{"codigo":"02.01","nombre":"Plano coordinado de redes","capitulo_codigo":"02","tipo_control":"previo","frecuencia":"Antes de abrir zanjas; actualizar cada vez que cambie un trazado.","criterio":"Disponer de un plano coordinado de saneamiento, pluviales, PCI, agua, MT/BT, telecomunicaciones y reservas, con cotas y cruces resueltos.","referencia_doc":"Presupuesto Dos Hermanas: cap. 01.03, pags. 6-15; cap. 02.13, pags. 158-163.","orden":1,"riesgo":"Cruces imposibles, pendientes insuficientes, afeccion a cimentaciones y aperturas posteriores de pavimentos.","nivel":"A","momento_tipo":"Previo","aplicabilidad":"Todas las obras con redes enterradas.","base_referencia":"Presupuesto Dos Hermanas: cap. 01.03, pags. 6-15; cap. 02.13, pags. 158-163."},{"codigo":"02.02","nombre":"Primera zanja de cada sistema","capitulo_codigo":"02","tipo_control":"primera_unidad","frecuencia":"Primeros 20-30 m de cada red y cada cambio de tipología o condición de cruce.","criterio":"Validar en la primera unidad la cama, clase y diámetro de tubo, juntas, pendiente, envolvente, separaciones, protecciones y señalización.","referencia_doc":"Presupuesto Dos Hermanas: cap. 01.03, pags. 6-15; cap. 02.13, pags. 158-163.","orden":2,"riesgo":"Repeticion sistematica de un detalle incorrecto durante cientos de metros.","nivel":"A","momento_tipo":"Primera unidad","aplicabilidad":"Todas las redes enterradas.","base_referencia":"Presupuesto Dos Hermanas: cap. 01.03, pags. 6-15; cap. 02.13, pags. 158-163."},{"codigo":"02.03","nombre":"Puntos singulares","capitulo_codigo":"02","tipo_control":"punto_parada","frecuencia":"100% de los puntos singulares antes de su cierre o relleno.","criterio":"Comprobar arquetas, pozos, sumideros, cambios de direccion/diámetro, acometidas, cruces, valvulas, separadores y estaciones de bombeo.","referencia_doc":"Presupuesto Dos Hermanas: cap. 01.03, pags. 6-15; cap. 02.13, pags. 158-163.","orden":3,"riesgo":"Atascos, falta de accesibilidad, conexiones erroneas, entradas de agua o equipos imposibles de mantener.","nivel":"A","momento_tipo":"Punto de parada","aplicabilidad":"Segun elementos existentes en cada proyecto.","base_referencia":"Presupuesto Dos Hermanas: cap. 01.03, pags. 6-15; cap. 02.13, pags. 158-163."},{"codigo":"02.04","nombre":"Autorización de tapado y as-built","capitulo_codigo":"02","tipo_control":"punto_parada","frecuencia":"Cada tramo abierto, con longitud orientativa máxima de 50 m; 100% en cruces y derivaciones.","criterio":"No autorizar el relleno sin comprobar cotas, pendiente, protección y fotografía localizada; levantar la posición final de los elementos principales.","referencia_doc":"Presupuesto Dos Hermanas: cap. 01.03, pags. 6-15; cap. 02.13, pags. 158-163.","orden":4,"riesgo":"Perdida de trazabilidad de instalaciones ocultas y reparaciones costosas tras ejecutar soleras o viales.","nivel":"A","momento_tipo":"Punto de parada","aplicabilidad":"Todas las obras con redes enterradas.","base_referencia":"Presupuesto Dos Hermanas: cap. 01.03, pags. 6-15; cap. 02.13, pags. 158-163."},{"codigo":"03.01","nombre":"Replanteo y tipología de pilotes","capitulo_codigo":"03","tipo_control":"previo","frecuencia":"100% de las cimentaciones con pilotaje.","criterio":"Comprobar posición, número, modelo/tipo, orientacion y correspondencia de cada pilote con la cimentacion prevista.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.02, pags. 75-77. Informe de cimentaciones, pags. 1-12.","orden":1,"riesgo":"Encepados incompatibles, pilotes fuera de tolerancia o capacidad distinta a la proyectada.","nivel":"C","momento_tipo":"Previo / Periódico","aplicabilidad":"Solo si existe pilotaje; pasa a ser control imprescindible cuando exista.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.02, pags. 75-77. Informe de cimentaciones, pags. 1-12."},{"codigo":"03.02","nombre":"Registro de ejecución del pilotaje","capitulo_codigo":"03","tipo_control":"punto_parada","frecuencia":"Cada pilote o, como mínimo, cada cimentacion; incidencia siempre individualizada.","criterio":"Registrar ejecución, hinca/perforacion, incidencias, rechazo o profundidad, desviaciones y decisión adoptada antes de avanzar de fase.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.02, pags. 75-77. Informe de cimentaciones, pags. 1-12.","orden":2,"riesgo":"Pilotes incompletos o no conformes ocultos bajo la cimentacion y falta de trazabilidad para la dirección facultativa.","nivel":"C","momento_tipo":"Periódico / Punto de parada","aplicabilidad":"Solo si existe pilotaje.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.02, pags. 75-77. Informe de cimentaciones, pags. 1-12."},{"codigo":"03.03","nombre":"Fondo de excavación y hormigón de limpieza","capitulo_codigo":"03","tipo_control":"punto_parada","frecuencia":"100% de cimentaciones antes de ejecutar la limpieza.","criterio":"Comprobar cota, dimensiones, estado del terreno, limpieza, achiques y geometría antes del hormigón de limpieza.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.02, pags. 75-77. Informe de cimentaciones, pags. 1-12.","orden":3,"riesgo":"Cimentacion apoyada a cota o terreno incorrectos, contaminacion del hormigón y consumos no previstos.","nivel":"A","momento_tipo":"Punto de parada","aplicabilidad":"Todas las cimentaciones.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.02, pags. 75-77. Informe de cimentaciones, pags. 1-12."},{"codigo":"03.04","nombre":"Descabezado y preparacion de pilotes","capitulo_codigo":"03","tipo_control":"punto_parada","frecuencia":"100% de grupos de pilotes.","criterio":"Verificar cota de descabezado, eliminacion de hormigón danado, integridad, armaduras vistas y limpieza antes de montar la ferralla.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.02, pags. 75-77. Informe de cimentaciones, pags. 1-12.","orden":4,"riesgo":"Transmision deficiente de cargas, fisuras y falta de anclaje entre pilote y encepado.","nivel":"C","momento_tipo":"Punto de parada","aplicabilidad":"Solo si existe pilotaje.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.02, pags. 75-77. Informe de cimentaciones, pags. 1-12."},{"codigo":"03.05","nombre":"Armaduras, recubrimientos y elementos embebidos","capitulo_codigo":"03","tipo_control":"punto_parada","frecuencia":"100% de cimentaciones antes del hormigonado.","criterio":"Comprobar geometría, diámetros, solapes, separadores, recubrimientos, esperas, puesta a tierra y elementos embebidos antes del hormigonado.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.02, pags. 75-77. Informe de cimentaciones, pags. 1-12.","orden":5,"riesgo":"Perdida de capacidad estructural, corrosiones, olvidos irreparables y demoliciones posteriores.","nivel":"A","momento_tipo":"Punto de parada","aplicabilidad":"Todas las cimentaciones; no sustituye a la inspección facultativa.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.02, pags. 75-77. Informe de cimentaciones, pags. 1-12."},{"codigo":"03.06","nombre":"Calices, PEIKO, pernos y placas","capitulo_codigo":"03","tipo_control":"punto_parada","frecuencia":"100% de los anclajes y alojamientos antes de hormigonar.","criterio":"Verificar modelo, orientacion, coordenadas, cota, nivel, aplomado y fijacion de calices, placas, PEIKO o pernos mediante comprobación topografica.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.02, pags. 75-77. Informe de cimentaciones, pags. 1-12.","orden":6,"riesgo":"Imposibilidad de montar pilares/equipos, correcciones metalicas improvisadas y perdida de tolerancias.","nivel":"A","momento_tipo":"Punto de parada","aplicabilidad":"Segun sistema de conexión previsto.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.02, pags. 75-77. Informe de cimentaciones, pags. 1-12."},{"codigo":"04.01","nombre":"Procedimiento y secuencia de montaje","capitulo_codigo":"04","tipo_control":"punto_parada","frecuencia":"Una vez antes del inicio y cada revisión que altere secuencia o medios.","criterio":"Solicitar procedimiento de montaje, planos vigentes, secuencia, gruas, arriostramiento provisional, tolerancias, manipulacion y plan de incidencias; obtener validación previa.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.03, pags. 77-79.","orden":1,"riesgo":"Inestabilidad durante el montaje, maniobras incompatibles y decisiones improvisadas en obra.","nivel":"A","momento_tipo":"Previo / Punto de parada","aplicabilidad":"Todas las estructuras prefabricadas.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.03, pags. 77-79."},{"codigo":"04.02","nombre":"Recepción e identificación de piezas","capitulo_codigo":"04","tipo_control":"periodico","frecuencia":"100% de identificación visual; registro por camion o lote.","criterio":"Identificar cada pilar, viga, correa y panel contra plano de montaje; revisar daños, apoyos, insertos y reparaciones de transporte.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.03, pags. 77-79.","orden":2,"riesgo":"Colocacion de una pieza de armado o geometría distinta en una posición incorrecta.","nivel":"A","momento_tipo":"Recepción / Periódico","aplicabilidad":"Todas las estructuras prefabricadas.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.03, pags. 77-79."},{"codigo":"04.03","nombre":"Pilares: apoyo, aplomado y estabilización","capitulo_codigo":"04","tipo_control":"primera_unidad","frecuencia":"100% de pilares; ficha detallada del primer portico y, después, al menos uno por cada cinco porticos.","criterio":"Comprobar asiento en caliz/placa, calces autorizados, aplomado, cota, relleno o grout y estabilidad provisional.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.03, pags. 77-79.","orden":3,"riesgo":"Desplomes, excentricidades, apoyo deficiente y perdida de estabilidad antes de completar el portico.","nivel":"A","momento_tipo":"Primera unidad / Periódico","aplicabilidad":"Todas las estructuras prefabricadas.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.03, pags. 77-79."},{"codigo":"04.04","nombre":"Arriostramiento antes de cerrar","capitulo_codigo":"04","tipo_control":"punto_parada","frecuencia":"100% de sectores antes de iniciar el cerramiento o cargar la estructura.","criterio":"No permitir paneles de fachada ni cargas adicionales hasta que el portico o sector disponga del arriostramiento previsto y estabilidad confirmada.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.03, pags. 77-79.","orden":4,"riesgo":"Colapso o deformacion durante el montaje y bloqueo de las operaciones de arriostramiento.","nivel":"A","momento_tipo":"Punto de parada","aplicabilidad":"Todas las estructuras prefabricadas.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.03, pags. 77-79."},{"codigo":"04.05","nombre":"Vigas y apoyos","capitulo_codigo":"04","tipo_control":"periodico","frecuencia":"100% de correspondencia pieza-posición; registro por portico o cada 10 vigas.","criterio":"Comprobar pieza correcta, apoyos, neoprenos, longitud de asiento, excentricidades, fijaciones y encuentros con pilares.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.03, pags. 77-79.","orden":5,"riesgo":"Apoyo insuficiente, pieza equivocada, concentraciones de tension y montaje fuera de tolerancia.","nivel":"A","momento_tipo":"Periódico","aplicabilidad":"Todas las estructuras prefabricadas.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.03, pags. 77-79."},{"codigo":"04.06","nombre":"Correas por vano y zonas de carga","capitulo_codigo":"04","tipo_control":"punto_parada","frecuencia":"100% por vano antes de cubrir.","criterio":"Verificar contra plano el número, tipo y posición de correas, especialmente donde existen secciones distintas o cargas de instalaciones.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.03, pags. 77-79.","orden":6,"riesgo":"Montaje de correas tubulares/JPR en vanos equivocados y falta de capacidad para equipos suspendidos.","nivel":"A","momento_tipo":"Punto de parada / Periódico","aplicabilidad":"Todas las cubiertas con correas; especial intensidad cuando existen tipologías diversas.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.03, pags. 77-79."},{"codigo":"04.07","nombre":"Modificaciones, daños y reparaciones","capitulo_codigo":"04","tipo_control":"punto_parada","frecuencia":"Cada desviación, dano o modificación.","criterio":"Prohibir cortes, taladros, soldaduras o reparaciones no aprobadas; documentar incidencia, solución y aceptacion antes de ocultarla.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.03, pags. 77-79.","orden":7,"riesgo":"Reduccion no calculada de capacidad, afeccion a pretensados y perdida de garantia/trazabilidad.","nivel":"A","momento_tipo":"Incidencia / Punto de parada","aplicabilidad":"Todas las estructuras prefabricadas.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.03, pags. 77-79."},{"codigo":"05.01","nombre":"Documentación de taller y sistemas de unión","capitulo_codigo":"05","tipo_control":"previo","frecuencia":"Por paquete de fabricación y cada revisión.","criterio":"Revisar planos de taller, perfiles, calidad de acero, tornilleria, soldaduras, placas, anclajes, protección anticorrosiva y protección al fuego.","referencia_doc":"Presupuesto Dos Hermanas: estructuras auxiliares y marquesinas, pags. 64 y 174-175.","orden":1,"riesgo":"Fabricación incompatible con proyecto, uniones insuficientes y tratamientos incompletos.","nivel":"B","momento_tipo":"Previo","aplicabilidad":"Aplicable a bancadas, marquesinas, escaleras, subestructuras y elementos auxiliares.","base_referencia":"Presupuesto Dos Hermanas: estructuras auxiliares y marquesinas, pags. 64 y 174-175."},{"codigo":"05.02","nombre":"Montaje y conexiones criticas","capitulo_codigo":"05","tipo_control":"primera_unidad","frecuencia":"Primera unidad de cada tipo; muestreo orientativo del 20%; 100% de conexiones criticas.","criterio":"Controlar geometría, placas base, anclajes, apriete, soldaduras de obra, apoyos y reposición de recubrimientos en la primera unidad y puntos críticos.","referencia_doc":"Presupuesto Dos Hermanas: estructuras auxiliares y marquesinas, pags. 64 y 174-175.","orden":2,"riesgo":"Inestabilidad local, perdida de durabilidad, equipos mal apoyados y uniones sin capacidad.","nivel":"B","momento_tipo":"Primera unidad / Periódico / Final","aplicabilidad":"Puede integrarse en el capítulo principal cuando el volumen metalico sea pequeno.","base_referencia":"Presupuesto Dos Hermanas: estructuras auxiliares y marquesinas, pags. 64 y 174-175."},{"codigo":"06.01","nombre":"Plan de ejecución de solera","capitulo_codigo":"06","tipo_control":"previo","frecuencia":"Antes del primer paño y cada cambio de formula, proveedor o sistema.","criterio":"Aprobar composicion, fibras, juntas, secuencia de paños, suministro, equipos, endurecedor, curado, tolerancias y protección posterior.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.04, pags. 79-83.","orden":1,"riesgo":"Fisuracion generalizada, diferencias de acabado, juntas mal situadas y falta de capacidad o planimetría.","nivel":"A","momento_tipo":"Previo","aplicabilidad":"Todas las soleras industriales.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.04, pags. 79-83."},{"codigo":"06.02","nombre":"Subbase y cotas antes del hormigonado","capitulo_codigo":"06","tipo_control":"punto_parada","frecuencia":"Cada paño o jornada antes de colocar laminas y hormigonar.","criterio":"Comprobar cota, planeidad, limpieza, continuidad y ausencia de zonas blandas o alteradas en el área del vertido.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.04, pags. 79-83.","orden":2,"riesgo":"Espesor insuficiente de solera, asentamientos y consumos de hormigón no controlados.","nivel":"A","momento_tipo":"Punto de parada","aplicabilidad":"Todas las soleras industriales.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.04, pags. 79-83."},{"codigo":"06.03","nombre":"Laminas, aislamiento y desolidarizacion","capitulo_codigo":"06","tipo_control":"punto_parada","frecuencia":"100% del área de cada paño antes del vertido.","criterio":"Verificar continuidad, solapes, reparación de perforaciones, aislamiento si existe y junta perimetral en pilares y encuentros.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.04, pags. 79-83.","orden":3,"riesgo":"Perdida de barrera de vapor, rozamiento restringido, puentes termicos y fisuras en encuentros.","nivel":"A","momento_tipo":"Punto de parada","aplicabilidad":"Segun solución de proyecto; aislamiento solo donde exista.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.04, pags. 79-83."},{"codigo":"06.04","nombre":"Juntas y refuerzos singulares","capitulo_codigo":"06","tipo_control":"punto_parada","frecuencia":"100% de juntas y puntos singulares antes del hormigonado.","criterio":"Comprobar perfiles de junta, pasadores, armadura local y refuerzos en pilares, esquinas, puertas, muelles, sumideros y cambios de espesor.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.04, pags. 79-83.","orden":4,"riesgo":"Fisuras concentradas, rotura de bordes y fallos bajo cargas puntuales.","nivel":"A","momento_tipo":"Punto de parada","aplicabilidad":"Todas las soleras industriales.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.04, pags. 79-83."},{"codigo":"06.05","nombre":"Control de cada vertido","capitulo_codigo":"06","tipo_control":"periodico","frecuencia":"Una ficha por paño/jornada; comprobaciones de espesor durante todo el vertido.","criterio":"Registrar paño, hormigón, tiempos, dosificación documental de fibras, espesor, Laser Screed, endurecedor, acabado y condiciones ambientales.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.04, pags. 79-83.","orden":5,"riesgo":"Variaciones entre jornadas, zonas con menor espesor o fibra y acabado incompatible con la operación logistica.","nivel":"A","momento_tipo":"Periódico","aplicabilidad":"Todas las soleras industriales.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.04, pags. 79-83."},{"codigo":"06.06","nombre":"Curado, juntas, protección y planimetría","capitulo_codigo":"06","tipo_control":"final","frecuencia":"Cada paño tras el vertido y control final por sectores antes de entrega.","criterio":"Controlar aplicación de curado, ejecución/sellado de juntas previstas, protección frente a trafico prematuro y medición final de planeidad/horizontalidad.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.04, pags. 79-83.","orden":6,"riesgo":"Desecacion, fisuracion, bordes deteriorados y rechazo por no cumplir TR34/FM2 u otras tolerancias de proyecto.","nivel":"A","momento_tipo":"Final / Periódico","aplicabilidad":"Todas las soleras industriales.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.04, pags. 79-83."},{"codigo":"07.01","nombre":"Procedimiento, materiales y muestra inicial","capitulo_codigo":"07","tipo_control":"primera_unidad","frecuencia":"Antes de iniciar; repetir muestra cuando cambie equipo, material o zona de viento.","criterio":"Aprobar sistema de cubierta, espesores, fichas, patron de fijaciones por zona de viento, detalles y una muestra inicial completa.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.05.01, pags. 84-87.","orden":1,"riesgo":"Uso de materiales distintos, fijaciones insuficientes y reproduccion masiva de detalles incorrectos.","nivel":"A","momento_tipo":"Previo / Primera unidad","aplicabilidad":"Todas las cubiertas ligeras o deck.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.05.01, pags. 84-87."},{"codigo":"07.02","nombre":"Chapa soporte y fijaciones iniciales","capitulo_codigo":"07","tipo_control":"primera_unidad","frecuencia":"Primeros 300-500 m2 por equipo de montaje.","criterio":"En los primeros 300-500 m2 comprobar espesor, luces, apoyos, solapes, orientacion, número/posición de fijaciones y ejecución de tornillo y arandela.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.05.01, pags. 84-87.","orden":2,"riesgo":"Arrancamiento por viento, deformaciones, filtraciones y falta de soporte para aislamiento/membrana.","nivel":"A","momento_tipo":"Primera unidad","aplicabilidad":"Todas las cubiertas ligeras o deck.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.05.01, pags. 84-87."},{"codigo":"07.03","nombre":"Control periódico de producción","capitulo_codigo":"07","tipo_control":"periodico","frecuencia":"Cada 500-1.000 m2 por equipo y al cambiar de zona, cuadrilla o material.","criterio":"Repetir el control de chapa, fijaciones, aislamiento, continuidad, juntas y estado del soporte durante la producción normal.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.05.01, pags. 84-87.","orden":3,"riesgo":"Desviacion progresiva de calidad al aumentar el ritmo de montaje.","nivel":"A","momento_tipo":"Periódico","aplicabilidad":"Frecuencia ajustable a productividad y complejidad.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.05.01, pags. 84-87."},{"codigo":"07.04","nombre":"Membrana impermeable y soldaduras","capitulo_codigo":"07","tipo_control":"punto_parada","frecuencia":"Diario por frente de trabajo; antes de tapar cada detalle o zona reparada.","criterio":"Comprobar solapes, termofusion, continuidad, fijaciones, pliegues, punzonamientos y reparaciones; realizar verificaciones de soldadura segun sistema.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.05.01, pags. 84-87.","orden":4,"riesgo":"Filtraciones generalizadas o defectos ocultos bajo remates/equipos.","nivel":"A","momento_tipo":"Periódico / Punto de parada","aplicabilidad":"Cubiertas con membrana; adaptar a otros sistemas de impermeabilización.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.05.01, pags. 84-87."},{"codigo":"07.05","nombre":"Perimetros y remates","capitulo_codigo":"07","tipo_control":"punto_parada","frecuencia":"100% de perimetros y encuentros singulares.","criterio":"Revisar petos, coronaciones, encuentros, cambios de plano, remates metalicos, solapes, fijaciones y continuidad de impermeabilización.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.05.01, pags. 84-87.","orden":5,"riesgo":"Entrada de agua y desprendimiento de remates en las zonas más expuestas.","nivel":"A","momento_tipo":"Punto de parada","aplicabilidad":"Todas las cubiertas.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.05.01, pags. 84-87."},{"codigo":"07.06","nombre":"Huecos y elementos pasantes","capitulo_codigo":"07","tipo_control":"punto_parada","frecuencia":"100% de unidades; prueba sectorizada antes de recepción.","criterio":"Controlar al 100% lucernarios, aireadores, aliviaderos, sumideros, bancadas y penetraciones, incluidos marcos, refuerzos y prueba final de estanqueidad por sectores.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.05.01, pags. 84-87.","orden":6,"riesgo":"Filtraciones recurrentes, deformaciones locales y perdida de garantia de cubierta.","nivel":"A","momento_tipo":"Punto de parada / Final","aplicabilidad":"Segun elementos existentes.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.05.01, pags. 84-87."},{"codigo":"08.01","nombre":"Coordinación hidráulica y estructural","capitulo_codigo":"08","tipo_control":"previo","frecuencia":"Una vez antes de fabricar/montar y cada cambio de trazado o calculo.","criterio":"Confirmar sumideros, aliviaderos, diámetros, puntos de descarga, reservas, trazado y cargas de colectores contra proyecto y estructura.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.05.02, pags. 87-88; cap. 01.03, pags. 6-15.","orden":1,"riesgo":"Insuficiencia de desagüe, sobrecarga de cubierta e interferencias con vigas/correas.","nivel":"B","momento_tipo":"Previo","aplicabilidad":"Aplicable a sistemas sifonicos y redes de gran caudal.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.05.02, pags. 87-88; cap. 01.03, pags. 6-15."},{"codigo":"08.02","nombre":"Tuberias y soportacion","capitulo_codigo":"08","tipo_control":"primera_unidad","frecuencia":"Primer ramal completo; después cada ramal o aproximadamente cada 50 m.","criterio":"Comprobar diámetros, secuencia de reducciones, uniones, dilataciones, soportes, distancias, anclajes y ausencia de cargas no autorizadas.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.05.02, pags. 87-88; cap. 01.03, pags. 6-15.","orden":2,"riesgo":"Roturas, vibraciones, deformacion de colectores y sobrecarga de elementos estructurales.","nivel":"A","momento_tipo":"Primera unidad / Periódico","aplicabilidad":"Todas las redes de cubierta; adaptar a sistema convencional.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.05.02, pags. 87-88; cap. 01.03, pags. 6-15."},{"codigo":"08.03","nombre":"Sumideros, conexiones y prueba funcional","capitulo_codigo":"08","tipo_control":"punto_parada","frecuencia":"100% de sumideros, aliviaderos y descargas.","criterio":"Verificar al 100% unión sumidero-membrana, cazoleta, accesibilidad, limpieza, rebosaderos y prueba de estanqueidad/funcionamiento.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.05.02, pags. 87-88; cap. 01.03, pags. 6-15.","orden":3,"riesgo":"Entrada de agua en la envolvente, obturacion y acumulacion peligrosa de agua.","nivel":"A","momento_tipo":"Punto de parada / Final","aplicabilidad":"Todas las cubiertas con evacuación de pluviales.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.05.02, pags. 87-88; cap. 01.03, pags. 6-15."},{"codigo":"09.01","nombre":"Despiece, tipos y sistemas de fijacion","capitulo_codigo":"09","tipo_control":"previo","frecuencia":"Antes del primer panel y cada revisión de fachada.","criterio":"Aprobar despiece, paneles, prestaciones EI, apoyos, anclajes, sellados, huecos, juntas y remates antes de iniciar el montaje.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.06, pags. 89-91.","orden":1,"riesgo":"Panel equivocado, anclaje incompatible, huecos mal posicionados y perdida de estanqueidad o sectorizacion.","nivel":"A","momento_tipo":"Previo","aplicabilidad":"Todas las fachadas industriales.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.06, pags. 89-91."},{"codigo":"09.02","nombre":"Primera unidad y control por fachada","capitulo_codigo":"09","tipo_control":"primera_unidad","frecuencia":"Primer panel de cada tipo; después cada 20 paneles o, como mínimo, una vez por fachada y jornada.","criterio":"Validar primer panel o modulo completo: identificación, apoyos, fijacion, aplomado, alineacion, ancho de junta y acabado; repetir muestreo en producción.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.06, pags. 89-91.","orden":2,"riesgo":"Repeticion de errores geometricos y juntas fuera de tolerancia a lo largo de toda la fachada.","nivel":"A","momento_tipo":"Primera unidad / Periódico","aplicabilidad":"Adaptar frecuencia a tamaño de panel y ritmo de montaje.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.06, pags. 89-91."},{"codigo":"09.03","nombre":"Secuencia, huecos y sellados","capitulo_codigo":"09","tipo_control":"punto_parada","frecuencia":"100% de zonas singulares; muestreo de sellado aproximadamente cada 50 m.","criterio":"No montar cerramiento sobre estructura no estabilizada; controlar al 100% esquinas, huecos, coronaciones, encuentros y continuidad del sellado normal/ignifugo.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.06, pags. 89-91.","orden":3,"riesgo":"Inestabilidad en montaje, filtraciones, desprendimientos y perdida de resistencia al fuego.","nivel":"A","momento_tipo":"Punto de parada / Periódico","aplicabilidad":"Todas las fachadas; sellado ignifugo solo donde lo exija el proyecto.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.06, pags. 89-91."},{"codigo":"10.01","nombre":"Plano coordinado de cada tipología de muelle","capitulo_codigo":"10","tipo_control":"previo","frecuencia":"Una vez por tipología y cada cambio de fabricante o modelo.","criterio":"Coordinar foso, estructura, fachada, solera, drenaje, placas, guias, equipos y cotas de camion antes de ejecutar obra civil.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.09, pags. 114-120.","orden":1,"riesgo":"Equipos que no caben, diferencias de nivel, interferencias con puertas y retrabajos de hormigón/estructura.","nivel":"A","momento_tipo":"Previo","aplicabilidad":"Obras con muelles o puertas industriales especiales.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.09, pags. 114-120."},{"codigo":"10.02","nombre":"Fosos, huecos y elementos embebidos","capitulo_codigo":"10","tipo_control":"punto_parada","frecuencia":"100% de muelles y huecos.","criterio":"Comprobar dimensiones, diagonales, cotas, pendientes, placas, reservas, drenaje y marcos antes de hormigonar y antes de montar equipos.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.09, pags. 114-120.","orden":2,"riesgo":"Niveladores fuera de tolerancia, agua en fosos y necesidad de cortar o recrecer hormigón.","nivel":"A","momento_tipo":"Punto de parada","aplicabilidad":"Obras con muelles/puertas.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.09, pags. 114-120."},{"codigo":"10.03","nombre":"Primer muelle completo y repeticion","capitulo_codigo":"10","tipo_control":"primera_unidad","frecuencia":"Primera unidad de cada tipo; comprobación dimensional y funcional del 100% restante.","criterio":"Montar una unidad patron y validar nivelador, topes, abrigo, puerta, guias, sellados, protecciones e interfaces; trasladar el patron al resto.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.09, pags. 114-120.","orden":3,"riesgo":"Errores repetitivos de montaje, falta de estanqueidad y golpes durante la explotacion.","nivel":"A","momento_tipo":"Primera unidad / Periódico","aplicabilidad":"Obras con muelles/puertas.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.09, pags. 114-120."},{"codigo":"10.04","nombre":"Prueba funcional y de seguridad","capitulo_codigo":"10","tipo_control":"final","frecuencia":"100% de equipos antes de recepción.","criterio":"Probar maniobras, enclavamientos, finales de carrera, emergencia, SAI si existe, nivelacion, estanqueidad y operación conjunta puerta-muelle.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.09, pags. 114-120.","orden":4,"riesgo":"Accidentes, atrapamientos, indisponibilidad del muelle y averias en la puesta en marcha.","nivel":"A","momento_tipo":"Final","aplicabilidad":"Obras con muelles/puertas.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.09, pags. 114-120."},{"codigo":"11.01","nombre":"Coordinación de implantación y soportes","capitulo_codigo":"11","tipo_control":"previo","frecuencia":"Antes del montaje de redes principales y por cada sector o zona de riesgo diferente.","criterio":"Aprobar trazados, sectores, puestos de control, rociadores, BIE, hidrantes, deteccion, aireadores y soportacion, coordinados con estructura y otras instalaciones.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.11, pags. 137-151; cap. 02.14, pags. 164-166.","orden":1,"riesgo":"Falta de cobertura, interferencias, sobrecargas y necesidad de modificar instalaciones ya terminadas.","nivel":"A","momento_tipo":"Previo","aplicabilidad":"Todas las obras con instalaciones PCI.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.11, pags. 137-151; cap. 02.14, pags. 164-166."},{"codigo":"11.02","nombre":"Primera crujía y control periódico de red","capitulo_codigo":"11","tipo_control":"primera_unidad","frecuencia":"Primera crujía; después cada sector, cada 1.000 m2 o cada 25 soportes, lo que resulte más exigente.","criterio":"Validar tuberias, pendientes cuando proceda, distancias de soportes, anclajes, abrazaderas, orientacion de rociadores y obstáculos en una crujía patron.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.11, pags. 137-151; cap. 02.14, pags. 164-166.","orden":2,"riesgo":"Soportes insuficientes, rociadores obstruidos y errores repetidos en toda la nave.","nivel":"A","momento_tipo":"Primera unidad / Periódico","aplicabilidad":"Adaptar a densidad y tipología de sistema.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.11, pags. 137-151; cap. 02.14, pags. 164-166."},{"codigo":"11.03","nombre":"Equipos y puntos críticos","capitulo_codigo":"11","tipo_control":"punto_parada","frecuencia":"100% de equipos y nodos críticos.","criterio":"Controlar al 100% grupo de bombeo, deposito, puestos de control, valvulas supervisadas, hidrantes, conexiones de bomberos y accesibilidad/mantenimiento.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.11, pags. 137-151; cap. 02.14, pags. 164-166.","orden":3,"riesgo":"Sistema inoperativo, valvulas inaccesibles y fallos en elementos de los que depende toda la instalación.","nivel":"A","momento_tipo":"Punto de parada / Final","aplicabilidad":"Segun sistemas existentes.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.11, pags. 137-151; cap. 02.14, pags. 164-166."},{"codigo":"11.04","nombre":"Control de humos e integración final","capitulo_codigo":"11","tipo_control":"punto_parada","frecuencia":"100% de aireadores y una prueba integrada por escenario/sector.","criterio":"Comprobar aireadores/exutorios, zonas, circuitos, apertura/cierre, sensores, cuadros, penetraciones de cubierta y prueba integrada con deteccion y alimentacion.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.11, pags. 137-151; cap. 02.14, pags. 164-166.","orden":4,"riesgo":"Fallo de evacuación de humos, filtraciones y ausencia de respuesta coordinada en emergencia.","nivel":"A","momento_tipo":"Punto de parada / Final","aplicabilidad":"Segun sistema de control de humos previsto.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.11, pags. 137-151; cap. 02.14, pags. 164-166."},{"codigo":"12.01","nombre":"Matriz de soportes y cargas autorizadas","capitulo_codigo":"12","tipo_control":"previo","frecuencia":"Antes del inicio de instalaciones; actualizar con cada nueva tipología.","criterio":"Definir por elemento estructural los detalles tipo, cargas admisibles, perfiles, anclajes, tornillos, distancias a bordes y responsables de aprobación.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.03.01, pag. 77; instalaciones, pags. 121-163. Propuesta interna transversal.","orden":1,"riesgo":"Cada industrial adopta una solución distinta y se introducen cargas o anclajes no previstos.","nivel":"A","momento_tipo":"Previo","aplicabilidad":"Todas las naves con instalaciones suspendidas.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.03.01, pag. 77; instalaciones, pags. 121-163. Propuesta interna transversal."},{"codigo":"12.02","nombre":"Zonas no perforables y permiso de taladro","capitulo_codigo":"12","tipo_control":"punto_parada","frecuencia":"100% de taladros fuera del detalle estandar; registro individual de excepciones.","criterio":"Marcar elementos y zonas donde no se puede taladrar, especialmente pretensados; exigir autorización individual para cualquier perforacion excepcional.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.03.01, pag. 77; instalaciones, pags. 121-163. Propuesta interna transversal.","orden":2,"riesgo":"Corte de armaduras o tendones, perdida de capacidad estructural y reparaciones de alto riesgo.","nivel":"A","momento_tipo":"Previo / Punto de parada","aplicabilidad":"Todas las estructuras prefabricadas o pretensadas.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.03.01, pag. 77; instalaciones, pags. 121-163. Propuesta interna transversal."},{"codigo":"12.03","nombre":"Soporte patron por industrial","capitulo_codigo":"12","tipo_control":"primera_unidad","frecuencia":"Una unidad por tipología, industrial y elemento estructural de apoyo.","criterio":"Ejecutar y aprobar una primera unidad de cada sistema de soporte antes de su repeticion: bandejas, PCI, clima, frío, saneamiento, etc.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.03.01, pag. 77; instalaciones, pags. 121-163. Propuesta interna transversal.","orden":3,"riesgo":"Multiplicacion de una solución incorrecta en cientos de soportes.","nivel":"A","momento_tipo":"Primera unidad","aplicabilidad":"Todas las instalaciones suspendidas.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.03.01, pag. 77; instalaciones, pags. 121-163. Propuesta interna transversal."},{"codigo":"12.04","nombre":"Muestreo de soportes repetitivos","capitulo_codigo":"12","tipo_control":"periodico","frecuencia":"Cada 25 soportes o aproximadamente cada 500 m de instalación; reiniciar muestreo al cambiar de cuadrilla.","criterio":"Comprobar perfil, separacion, varillas, anclajes, profundidad, par de apriete, protección anticorrosiva y montaje de soportes repetitivos.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.03.01, pag. 77; instalaciones, pags. 121-163. Propuesta interna transversal.","orden":4,"riesgo":"Fallo progresivo de soportacion, vibraciones y desprendimientos durante la explotacion.","nivel":"A","momento_tipo":"Periódico","aplicabilidad":"Frecuencia orientativa a validar con el equipo.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.03.01, pag. 77; instalaciones, pags. 121-163. Propuesta interna transversal."},{"codigo":"12.05","nombre":"Cargas concentradas y soportes compartidos","capitulo_codigo":"12","tipo_control":"punto_parada","frecuencia":"100% de cargas concentradas y soluciones no estandar.","criterio":"Revisar al 100% equipos pesados, cambios de direccion, puntos fijos, colectores, bancadas y soportes usados por varias instalaciones; mantener registro as-built de cargas.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.03.01, pag. 77; instalaciones, pags. 121-163. Propuesta interna transversal.","orden":5,"riesgo":"Sobrecarga local de vigas/correas y transferencia de esfuerzos no contemplada en calculo.","nivel":"A","momento_tipo":"Punto de parada","aplicabilidad":"Todas las naves con equipos o redes de gran peso.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.03.01, pag. 77; instalaciones, pags. 121-163. Propuesta interna transversal."},{"codigo":"13.01","nombre":"Reserva y aprobación de huecos","capitulo_codigo":"13","tipo_control":"punto_parada","frecuencia":"100% de huecos planificados y cualquier hueco nuevo.","criterio":"Coordinar y aprobar huecos, pasatubos, marcos y refuerzos antes de fabricar estructura, cerrar fachada o ejecutar cubierta/solera.","referencia_doc":"Presupuesto Dos Hermanas: cubiertas, fachadas y PCI, pags. 84-91 y 137-151. Propuesta interna transversal.","orden":1,"riesgo":"Cortes posteriores no calculados, perdida de prestaciones y retrasos por falta de reserva.","nivel":"A","momento_tipo":"Previo / Punto de parada","aplicabilidad":"Todas las obras con instalaciones que atraviesen elementos constructivos.","base_referencia":"Presupuesto Dos Hermanas: cubiertas, fachadas y PCI, pags. 84-91 y 137-151. Propuesta interna transversal."},{"codigo":"13.02","nombre":"Penetraciones de envolvente","capitulo_codigo":"13","tipo_control":"punto_parada","frecuencia":"100% de penetraciones antes de ocultar o montar el equipo definitivo.","criterio":"Controlar al 100% pasos por cubierta, fachada y solera: marco, soporte, refuerzo, sellado, impermeabilización, goteron y protección mecánica.","referencia_doc":"Presupuesto Dos Hermanas: cubiertas, fachadas y PCI, pags. 84-91 y 137-151. Propuesta interna transversal.","orden":2,"riesgo":"Filtraciones, entrada de aire/agua, punzonamiento y deterioro de la envolvente.","nivel":"A","momento_tipo":"Punto de parada","aplicabilidad":"Todas las penetraciones de envolvente.","base_referencia":"Presupuesto Dos Hermanas: cubiertas, fachadas y PCI, pags. 84-91 y 137-151. Propuesta interna transversal."},{"codigo":"13.03","nombre":"Sellados de sectorizacion","capitulo_codigo":"13","tipo_control":"punto_parada","frecuencia":"100% de penetraciones de sectores y franjas cortafuego.","criterio":"Verificar sistema ensayado, soporte, espesor, dimensiones, relleno, identificación y registro fotográfico de cada paso de sector de incendio.","referencia_doc":"Presupuesto Dos Hermanas: cubiertas, fachadas y PCI, pags. 84-91 y 137-151. Propuesta interna transversal.","orden":3,"riesgo":"Perdida de compartimentación y rechazo en legalización o inspección final.","nivel":"A","momento_tipo":"Punto de parada / Final","aplicabilidad":"Solo donde existan elementos de sectorizacion, pero imprescindible en ellos.","base_referencia":"Presupuesto Dos Hermanas: cubiertas, fachadas y PCI, pags. 84-91 y 137-151. Propuesta interna transversal."},{"codigo":"14.01","nombre":"Red de tierras y equipotencialidad","capitulo_codigo":"14","tipo_control":"punto_parada","frecuencia":"100% de tramos antes de ocultar y comprobación final de continuidad.","criterio":"Comprobar trazado, uniones, derivaciones, conexiones a estructura y elementos embebidos antes de tapar u hormigonar; verificar continuidad.","referencia_doc":"Presupuesto Dos Hermanas: caps. 01.04-01.05, pags. 15-22; cap. 02.10, pags. 121-136.","orden":1,"riesgo":"Red interrumpida, ausencia de conexiones ocultas y protección eléctrica deficiente.","nivel":"B","momento_tipo":"Punto de parada","aplicabilidad":"Todas las obras; intensidad segun alcance eléctrico.","base_referencia":"Presupuesto Dos Hermanas: caps. 01.04-01.05, pags. 15-22; cap. 02.10, pags. 121-136."},{"codigo":"14.02","nombre":"Bancadas y obra civil de CT/grupos","capitulo_codigo":"14","tipo_control":"punto_parada","frecuencia":"100% de centros, transformadores y grupos antes de entrega de la bancada.","criterio":"Verificar dimensiones, capacidad, cotas, accesos, fosos, drenaje, entradas de cables, ventilacion y reservas antes de colocar equipos.","referencia_doc":"Presupuesto Dos Hermanas: caps. 01.04-01.05, pags. 15-22; cap. 02.10, pags. 121-136.","orden":2,"riesgo":"Equipos que no pueden instalarse, inundaciones, falta de mantenimiento y modificaciones de obra civil tardias.","nivel":"B","momento_tipo":"Punto de parada","aplicabilidad":"Solo si existen CT, centros de seccionamiento o grupos electrógenos.","base_referencia":"Presupuesto Dos Hermanas: caps. 01.04-01.05, pags. 15-22; cap. 02.10, pags. 121-136."},{"codigo":"14.03","nombre":"Canalizaciones principales y reservas","capitulo_codigo":"14","tipo_control":"punto_parada","frecuencia":"Cada tramo abierto, orientativamente máximo 50 m, y 100% de cruces/entradas.","criterio":"Controlar trazado, diámetros, número de tubos, separaciones, hormigonado/protección, arquetas, guias, sellado y posición as-built antes de tapar.","referencia_doc":"Presupuesto Dos Hermanas: caps. 01.04-01.05, pags. 15-22; cap. 02.10, pags. 121-136.","orden":3,"riesgo":"Imposibilidad de tender cables, aplastamiento de tubos y apertura posterior de viales/soleras.","nivel":"B","momento_tipo":"Punto de parada","aplicabilidad":"Aplicable a MT, BT, telecomunicaciones y grandes reservas.","base_referencia":"Presupuesto Dos Hermanas: caps. 01.04-01.05, pags. 15-22; cap. 02.10, pags. 121-136."},{"codigo":"15.01","nombre":"Plan de pavimentacion y trafico","capitulo_codigo":"15","tipo_control":"previo","frecuencia":"Antes de ejecutar la primera zona y cada cambio de sección o uso.","criterio":"Aprobar secciones, zonas de carga, juntas, secuencia de paños, detalles de bordes, drenaje y protección durante la obra.","referencia_doc":"Presupuesto Dos Hermanas: cap. 01.02, pags. 3-5.","orden":1,"riesgo":"Pavimento incompatible con cargas reales, juntas mal situadas y daños por trafico prematuro.","nivel":"A","momento_tipo":"Previo","aplicabilidad":"Plataformas con viales de camiones o zonas de maniobra.","base_referencia":"Presupuesto Dos Hermanas: cap. 01.02, pags. 3-5."},{"codigo":"15.02","nombre":"Subbase, cotas y encuentros","capitulo_codigo":"15","tipo_control":"punto_parada","frecuencia":"Cada sector antes de hormigonar o extender mezcla bituminosa.","criterio":"Comprobar espesor, cota, planeidad, compactacion operativa, bordes, transiciones y encuentros con muelles, rigolas, arquetas y pavimentos distintos.","referencia_doc":"Presupuesto Dos Hermanas: cap. 01.02, pags. 3-5.","orden":2,"riesgo":"Asientos, escalones, charcos y rotura de bordes o tapas.","nivel":"A","momento_tipo":"Punto de parada","aplicabilidad":"Todas las zonas de pavimento pesado.","base_referencia":"Presupuesto Dos Hermanas: cap. 01.02, pags. 3-5."},{"codigo":"15.03","nombre":"Ejecución de hormigón/asfalto","capitulo_codigo":"15","tipo_control":"periodico","frecuencia":"Cada paño/jornada de hormigón o aproximadamente cada 2.000 m2/lote de asfalto.","criterio":"Controlar espesor, armadura/fibras, juntas, acabado, compactacion, temperaturas cuando proceda, curado y protección por lote de producción.","referencia_doc":"Presupuesto Dos Hermanas: cap. 01.02, pags. 3-5.","orden":3,"riesgo":"Capacidad insuficiente, fisuracion, desgranamiento y deformaciones por trafico.","nivel":"A","momento_tipo":"Periódico","aplicabilidad":"Adaptar al tipo de pavimento.","base_referencia":"Presupuesto Dos Hermanas: cap. 01.02, pags. 3-5."},{"codigo":"15.04","nombre":"Pendientes, drenaje y apertura al trafico","capitulo_codigo":"15","tipo_control":"punto_parada","frecuencia":"Cada sector terminado antes de abrirlo al trafico; comprobación adicional tras lluvia cuando sea posible.","criterio":"Revisar pendientes, ausencia de embalsamientos, sellado de juntas, tapas enrasadas y resistencia/edad antes de permitir trafico pesado.","referencia_doc":"Presupuesto Dos Hermanas: cap. 01.02, pags. 3-5.","orden":4,"riesgo":"Agua estancada, deterioro temprano y daños irreversibles durante la propia obra.","nivel":"B","momento_tipo":"Final / Punto de parada","aplicabilidad":"Todas las zonas de trafico pesado.","base_referencia":"Presupuesto Dos Hermanas: cap. 01.02, pags. 3-5."},{"codigo":"16.01","nombre":"Cargas y coordinación estructural del frío","capitulo_codigo":"16","tipo_control":"previo","frecuencia":"Antes de fabricar soportes y cada cambio de equipo o trazado.","criterio":"Confirmar cargas y posiciones de evaporadores, condensadores, colectores, techos suspendidos, tuberias y bancadas antes del montaje.","referencia_doc":"Presupuesto Dos Hermanas: refuerzos por frío, pag. 77; recintos e instalaciones, pags. 91-113 y 152-163.","orden":1,"riesgo":"Sobrecarga de vigas/correas y soportes improvisados sobre paneles o cubierta.","nivel":"C","momento_tipo":"Previo","aplicabilidad":"Solo en obras con frío industrial; pasa a ser imprescindible si existe.","base_referencia":"Presupuesto Dos Hermanas: refuerzos por frío, pag. 77; recintos e instalaciones, pags. 91-113 y 152-163."},{"codigo":"16.02","nombre":"Paneles, techos y suelo de cámaras","capitulo_codigo":"16","tipo_control":"primera_unidad","frecuencia":"Primera cámara o modulo; después aproximadamente cada 1.000 m2 de panel o por recinto.","criterio":"Validar primera zona y controlar tipo/espesor de panel, uniones, soportes, barrera de vapor, aislamiento de suelo y continuidad térmica.","referencia_doc":"Presupuesto Dos Hermanas: refuerzos por frío, pag. 77; recintos e instalaciones, pags. 91-113 y 152-163.","orden":2,"riesgo":"Condensaciones, hielo, perdida energetica y fallo de techos o paneles suspendidos.","nivel":"C","momento_tipo":"Primera unidad / Periódico","aplicabilidad":"Solo en obras con cámaras o recintos frigorificos.","base_referencia":"Presupuesto Dos Hermanas: refuerzos por frío, pag. 77; recintos e instalaciones, pags. 91-113 y 152-163."},{"codigo":"16.03","nombre":"Penetraciones, drenajes y puesta en marcha","capitulo_codigo":"16","tipo_control":"punto_parada","frecuencia":"100% de penetraciones y drenajes; pruebas por circuito y recinto.","criterio":"Controlar al 100% pasos, sellados de vapor, puentes termicos, desagües de desescarche, pruebas de presión/estanqueidad y puesta en marcha coordinada.","referencia_doc":"Presupuesto Dos Hermanas: refuerzos por frío, pag. 77; recintos e instalaciones, pags. 91-113 y 152-163.","orden":3,"riesgo":"Fugas, condensaciones ocultas, agua/hielo y equipos incapaces de alcanzar condiciones de servicio.","nivel":"C","momento_tipo":"Punto de parada / Final","aplicabilidad":"Solo en obras con frío industrial.","base_referencia":"Presupuesto Dos Hermanas: refuerzos por frío, pag. 77; recintos e instalaciones, pags. 91-113 y 152-163."},{"codigo":"17.01","nombre":"Compatibilidad estructural y de cubierta","capitulo_codigo":"17","tipo_control":"previo","frecuencia":"Antes del montaje y cada cambio de sistema o distribución.","criterio":"Validar cargas, layout, zonas de viento, sistema de fijacion/lastre, pasillos, distancias PCI, drenaje y mantenimiento de garantia de cubierta.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.10.11, pags. 133-135.","orden":1,"riesgo":"Sobrecarga, arrancamiento por viento, bloqueo de sumideros y perdida de estanqueidad/garantia.","nivel":"C","momento_tipo":"Previo","aplicabilidad":"Solo si existe instalación fotovoltaica.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.10.11, pags. 133-135."},{"codigo":"17.02","nombre":"Montaje, cableado y penetraciones","capitulo_codigo":"17","tipo_control":"primera_unidad","frecuencia":"Primera fila; después cada 500 m2; 100% de penetraciones y puntos de conexión.","criterio":"Aprobar primera fila y controlar soportes, protecciones de membrana, apriete, cableado, bandejas, equipotencialidad y penetraciones.","referencia_doc":"Presupuesto Dos Hermanas: cap. 02.10.11, pags. 133-135.","orden":2,"riesgo":"Danos a cubierta, cables sueltos, corrosiones y filtraciones.","nivel":"C","momento_tipo":"Primera unidad / Periódico / Final","aplicabilidad":"Solo si existe instalación fotovoltaica.","base_referencia":"Presupuesto Dos Hermanas: cap. 02.10.11, pags. 133-135."},{"codigo":"18.01","nombre":"Procedimiento específico por elemento","capitulo_codigo":"18","tipo_control":"punto_parada","frecuencia":"Uno por tipología; 100% de puntos irreversibles definidos en el procedimiento.","criterio":"Activar un procedimiento propio para muros de contencion, balsas de tormenta, depósitos, fosos profundos o estaciones de bombeo, con puntos de parada de armado, drenaje e impermeabilización.","referencia_doc":"Presupuesto Dos Hermanas: muros, balsas y bombeos, pags. 14-15, 41-43 y 69-74.","orden":1,"riesgo":"Aplicar controles genericos a elementos con riesgos estructurales, geotecnicos o de estanqueidad particulares.","nivel":"C","momento_tipo":"Previo / Punto de parada","aplicabilidad":"Solo cuando exista la obra especial.","base_referencia":"Presupuesto Dos Hermanas: muros, balsas y bombeos, pags. 14-15, 41-43 y 69-74."},{"codigo":"18.02","nombre":"Pruebas funcionales, estanqueidad y mantenimiento","capitulo_codigo":"18","tipo_control":"final","frecuencia":"100% de elementos especiales antes de recepción.","criterio":"Realizar pruebas de estanqueidad/funcionamiento, verificar alarmas, bombas, accesos, ventilacion, limpieza, seguridad y documentación as-built.","referencia_doc":"Presupuesto Dos Hermanas: muros, balsas y bombeos, pags. 14-15, 41-43 y 69-74.","orden":2,"riesgo":"Inundaciones, equipos inaccesibles, fallos de bombeo y entrega de instalaciones que no pueden mantenerse.","nivel":"C","momento_tipo":"Final","aplicabilidad":"Solo cuando exista la obra especial.","base_referencia":"Presupuesto Dos Hermanas: muros, balsas y bombeos, pags. 14-15, 41-43 y 69-74."}],"plans":[{"code":"NOR02","phase":"Fase 1","title":"Levantamiento topográfico","file":"NOR02_F1.jpg","discipline":"Topografía","src":"extra"},{"code":"NOR03","phase":"Fase 1","title":"Desmontes y terraplenes","file":"NOR03_F1.jpg","discipline":"Movimiento de tierras","src":"extra"},{"code":"GEN01","phase":"Fase 1","title":"Distribución general. Parcela completa","file":"GEN01_Parcela_Completa_F1.jpg","discipline":"General"},{"code":"GEN02","phase":"Fase 1","title":"Distribución general. Nave. Planta general","file":"GEN02_Nave_Planta_General_F1.jpg","discipline":"General"},{"code":"ACA01","phase":"Fase 1","title":"Acabados. Suelos. Patios","file":"ACA01_F1.jpg","discipline":"Pavimentos","src":"extra"},{"code":"ACA02","phase":"Fase 1","title":"Acabados. Suelos. Nave y oficinas planta baja","file":"ACA02_F1.jpg","discipline":"Soleras","src":"extra"},{"code":"GEN06","phase":"Fase 1","title":"Distribución general. Nave. Planta cubiertas exteriores","file":"GEN06_Cubierta_Exterior_F1.jpg","discipline":"Cubie async function enter(){const [{data:p},{data:r},{data:o}]=await Promise.all([sb.from('profiles').select('*').eq('id',st.user.id).single(),sb.from('user_roles').select('*').eq('user_id',st.user.id).single(),sb.from('obras').select('*').order('codigo')]);st.profile=p;st.role=r?.role;st.obras=o||[];st.obra=st.obras.find(x=>x.id===localStorage.getItem('ppi_obra'))||st.obras.find(x=>x.activa)||st.obras[0];$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');$('#sideUser').textContent=st.profile?.full_name||st.user.email;$('#sideRole').textContent=ROLE[st.role]||st.role;$('#obraSelect').innerHTML=st.obras.map(o=>`<option value="${o.id}">${esc(o.codigo)} · ${esc(o.nombre)}${o.activa?'':' (inactiva)'}</option>`).join('');$('#obraSelect').value=st.obra.id;await seedMaster();await loadAll();renderNav();renderView();hydrateIcons()}
